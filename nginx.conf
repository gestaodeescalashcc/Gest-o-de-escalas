server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: qualquer rota do React Router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionados (com hash): cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html sempre revalidado (para pegar novos deploys)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
